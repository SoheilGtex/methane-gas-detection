[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "methane-monitor"
version = "0.1.0"
description = "Reproducible sensor-data and statistical anomaly detection platform"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.5", "PyYAML>=6.0", "fastapi>=0.110", "uvicorn[standard]>=0.27"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27", "ruff>=0.6"]
serial = ["pyserial>=3.5"]
plot = ["matplotlib>=3.8"]

[project.scripts]
methane-monitor = "methane_monitor.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501", "E701", "E702"]
